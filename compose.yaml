services:
  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      PAYOPS_DB: /app/runtime/payops.sqlite3
    volumes:
      - payops-data:/app/runtime
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  payops-data:
